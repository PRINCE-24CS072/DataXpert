<!DOCTYPE html>
<html>
<head>
    <title>Upload | DataXpert</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * { box-sizing: border-box; margin:0; padding:0 }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(10,20,30,0.8), rgba(0,100,150,0.7)),
                url("https://images.unsplash.com/photo-1555949963-aa79dcee981c?auto=format&fit=crop&w=1950&q=80") no-repeat center/cover;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.35);
        }

        .navbar h2 { margin:0; letter-spacing:1px }

        .navbar a {
            color: white;
            margin-left: 18px;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.95;
        }

        .navbar a:hover { opacity: 1; text-decoration: underline }

        .container { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px }

        .upload-card {
            width:100%; max-width:720px; background: rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.12); backdrop-filter: blur(8px);
            padding:30px; border-radius:12px; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }

        .upload-card h1 { color:#00e5ff; margin-bottom:8px }
        .upload-card p { color:#d0d0d0; margin-bottom:18px }

        form label { display:block; color:#e0e0e0; margin-bottom:8px }
        input[type=file] { display:block; margin-bottom:14px }

        .btn {
            display:inline-block; padding:12px 18px; border-radius:8px; border:none;
            background: linear-gradient(135deg,#00e5ff,#0099cc); color:#000; font-weight:700; cursor:pointer
        }

        @media (max-width:600px) {
            .navbar { padding:14px }
            .upload-card { padding:20px }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>DataXpert</h2>
        <div>
            <a href="home.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
              <a href="analysis.html">AI Analysis</a>
            <a href="login.html">Sign In</a>
            <a href="register.html">Sign Up</a>
        </div>
    </div>

    <div class="container">
        <div class="upload-card">
            <h1>Upload Data</h1>
            <p>Upload your datasets (CSV/Excel). Backend integration required to process files.</p>

            <form action="/api/upload" method="post" enctype="multipart/form-data">
                <label for="datafile">Select file to upload</label>
                <input id="datafile" type="file" name="datafile" accept=".csv, .xlsx">
                <div style="margin-top:12px">
                    <button class="btn" type="submit">Upload</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
