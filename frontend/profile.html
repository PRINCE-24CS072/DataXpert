<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - DataXpert</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span>DataXpert</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a href="analysis.html" class="nav-item">
                <i class="fas fa-robot"></i>
                <span>AI Analysis</span>
            </a>
            <a href="history.html" class="nav-item">
                <i class="fas fa-history"></i>
                <span>History</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <button class="btn btn-logout btn-full" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>Profile</h1>
            </div>
            <div class="topbar-right">
                <button class="theme-toggle" onclick="openSearchModal()" title="Search (Ctrl+K)">
                    <i class="fas fa-search"></i>
                </button>
                <div class="theme-toggle-wrapper" style="margin-left: 12px;">
                    <button class="theme-toggle-switch" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark mode">
                        <span class="theme-toggle-slider">
                            <i class="theme-toggle-icon fas fa-sun"></i>
                        </span>
                    </button>
                </div>
                <a href="profile.html" class="header-profile" style="text-decoration: none; color: inherit; margin-left: 15px;">
                    <div class="user-avatar">
                        <img id="userAvatar" src="" alt="Profile" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                        <i class="fas fa-user" id="avatarFallback"></i>
                    </div>
                    <div class="user-details">
                        <span id="userName" class="user-name">Loading...</span>
                        <span id="userEmail" class="user-email"></span>
                    </div>
                </a>
            </div>
        </header>

        <!-- Profile Content -->
        <div class="dashboard-container">
            <div class="profile-simple-grid">
                <!-- Profile Photo Card -->
                <div class="chart-card profile-photo-card">
                    <div class="profile-photo-center">
                        <div class="profile-photo-wrapper-large">
                            <img id="profilePhoto" src="" alt="Profile Photo" class="profile-photo-large">
                            <div class="photo-overlay" onclick="document.getElementById('profileImageInput').click()">
                                <i class="fas fa-camera"></i>
                                <span>Change Photo</span>
                            </div>
                        </div>
                        <input type="file" id="profileImageInput" accept="image/*" style="display:none;">
                        <p class="photo-hint">Click to change photo</p>
                    </div>
                </div>

                <!-- Change Name Card -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-user-edit"></i> Change Name</h3>
                    </div>
                    <form id="updateNameForm" class="simple-form">
                        <div class="form-group">
                            <label for="profileName">Full Name</label>
                            <input type="text" id="profileName" required placeholder="Enter your name">
                        </div>
                        <button type="submit" class="btn btn-blue btn-full">
                            <i class="fas fa-save"></i> Save Name
                        </button>
                    </form>
                </div>

                <!-- Change Password Card -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3><i class="fas fa-lock"></i> Change Password</h3>
                    </div>
                    <form id="changePasswordForm" class="simple-form">
                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="currentPassword" required placeholder="Enter current password">
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('currentPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="newPassword" required minlength="6" placeholder="Enter new password">
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('newPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm New Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="confirmPassword" required minlength="6" placeholder="Confirm new password">
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-blue btn-full">
                            <i class="fas fa-key"></i> Update Password
                        </button>
                    </form>
                    <div class="forgot-password-link">
                        <a href="#" onclick="openForgotPasswordModal()">
                            <i class="fas fa-question-circle"></i> Forgot your password?
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeForgotPasswordModal()">&times;</span>
            <h2><i class="fas fa-unlock-alt"></i> Reset Password</h2>
            <p>Enter your email to receive a password reset link</p>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Email Address</label>
                    <input type="email" id="resetEmail" required placeholder="your@email.com">
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-paper-plane"></i> Send Reset Link
                </button>
            </form>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="searchModal" class="search-modal">
        <div class="search-modal-content">
            <div class="search-header">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search pages..." autofocus>
                <kbd>ESC</kbd>
            </div>
            <div class="search-results">
                <a href="dashboard.html" class="search-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="analysis.html" class="search-item"><i class="fas fa-robot"></i> AI Analysis</a>
                <a href="history.html" class="search-item"><i class="fas fa-history"></i> History</a>
                <a href="profile.html" class="search-item"><i class="fas fa-user"></i> Profile</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/header-profile.js"></script>
    <script>
        // Check auth on load
        document.addEventListener('DOMContentLoaded', () => {
            if (!isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }
            loadProfileData();
        });

        // Load profile data
        function loadProfileData() {
            const userStr = localStorage.getItem(STORAGE_KEYS.USER);
            if (!userStr) return;
            
            const user = JSON.parse(userStr);
            document.getElementById('profileName').value = user.name || '';
            document.getElementById('resetEmail').value = user.email || '';
            
            // Load profile photo
            const photoEl = document.getElementById('profilePhoto');
            if (user.profile_image) {
                photoEl.src = user.profile_image;
            } else {
                photoEl.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="%23667eea"/><text x="50" y="60" text-anchor="middle" fill="white" font-size="40">' + (user.name ? user.name[0].toUpperCase() : 'U') + '</text></svg>';
            }
        }

        // Update name form
        document.getElementById('updateNameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('profileName').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            try {
                const response = await fetch(`${API_ENDPOINTS.UPDATE_PROFILE}`, {
                    method: 'PUT',
                    headers: { ...getAuthHeaders(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                
                const result = await response.json();
                if (result.success) {
                    // Update localStorage
                    const user = JSON.parse(localStorage.getItem(STORAGE_KEYS.USER));
                    user.name = name;
                    localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(user));
                    loadHeaderProfile();
                    showMessage('Name updated successfully!', 'success');
                } else {
                    showMessage(result.message || 'Failed to update name', 'error');
                }
            } catch (err) {
                showMessage('Error updating name', 'error');
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-save"></i> Save Name';
        });

        // Change password form
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            
            try {
                const response = await fetch(`${API_ENDPOINTS.CHANGE_PASSWORD}`, {
                    method: 'PUT',
                    headers: { ...getAuthHeaders(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
                });
                
                const result = await response.json();
                if (result.success) {
                    showMessage('Password updated successfully!', 'success');
                    e.target.reset();
                } else {
                    showMessage(result.message || 'Failed to update password', 'error');
                }
            } catch (err) {
                showMessage('Error updating password', 'error');
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-key"></i> Update Password';
        });

        // Profile photo upload
        document.getElementById('profileImageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // Preview immediately
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('profilePhoto').src = event.target.result;
            };
            reader.readAsDataURL(file);
            
            // Upload to server
            const formData = new FormData();
            formData.append('profile_image', file);
            
            try {
                const response = await fetch(`${API_ENDPOINTS.UPDATE_PROFILE}`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: formData
                });
                
                const result = await response.json();
                if (result.success && result.data.profile_image) {
                    const user = JSON.parse(localStorage.getItem(STORAGE_KEYS.USER));
                    user.profile_image = result.data.profile_image;
                    localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(user));
                    loadHeaderProfile();
                    showMessage('Photo updated!', 'success');
                }
            } catch (err) {
                showMessage('Error uploading photo', 'error');
            }
        });

        // Toggle password visibility
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling?.querySelector('i') || input.parentElement.querySelector('.toggle-password i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Forgot password modal
        function openForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').style.display = 'block';
        }
        
        function closeForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').style.display = 'none';
        }

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                showMessage('If your email exists, you will receive a reset link', 'success');
                closeForgotPasswordModal();
            } catch (err) {
                showMessage('Error sending reset link', 'error');
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
        });

        // Search modal
        function openSearchModal() {
            document.getElementById('searchModal').classList.add('active');
            document.getElementById('searchInput').focus();
        }
        
        function closeSearchModal() {
            document.getElementById('searchModal').classList.remove('active');
        }
        
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                openSearchModal();
            }
            if (e.key === 'Escape') closeSearchModal();
        });
        
        document.getElementById('searchModal').addEventListener('click', (e) => {
            if (e.target.classList.contains('search-modal')) closeSearchModal();
        });

        // Message display
        function showMessage(msg, type) {
            const existing = document.querySelector('.toast-message');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-message toast-${type}`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
            toast.style.cssText = 'position:fixed;top:20px;right:20px;padding:15px 25px;border-radius:8px;z-index:9999;animation:slideIn .3s ease;';
            toast.style.background = type === 'success' ? '#10b981' : '#ef4444';
            toast.style.color = 'white';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Menu toggle
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.querySelector('.sidebar').classList.toggle('active');
        });
    </script>

    <style>
        .profile-simple-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1000px;
        }

        .profile-photo-card {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .profile-photo-center {
            text-align: center;
        }

        .profile-photo-wrapper-large {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .profile-photo-large {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity .3s;
            color: white;
        }

        .profile-photo-wrapper-large:hover .photo-overlay {
            opacity: 1;
        }

        .photo-overlay i {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .photo-overlay span {
            font-size: 12px;
        }

        .photo-hint {
            margin-top: 15px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .simple-form {
            padding: 20px;
        }

        .simple-form .form-group {
            margin-bottom: 20px;
        }

        .simple-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .simple-form input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s;
        }

        .simple-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-input-wrapper {
            position: relative;
        }

        .password-input-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .forgot-password-link {
            text-align: center;
            padding: 15px;
            border-top: 1px solid var(--border-color);
        }

        .forgot-password-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }

        .btn-full {
            width: 100%;
        }

        .btn-blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-blue:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        /* Header profile styles */
        .header-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .user-email {
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .user-details {
                display: none;
            }
        }
    </style>
</body>
</html>
