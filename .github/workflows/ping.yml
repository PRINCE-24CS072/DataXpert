name: Keep Render Awake

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 minutes)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          echo "Pinging Render at $(date)"
          curl -f https://dataxpert-5twp.onrender.com/api/health || echo "Ping failed"
          echo "✅ Render is awake"
